[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.1.0"
description = "Clinical Co-Pilot agent — grounded, cited point-of-care synthesis over OpenEMR's OAuth2/SMART-FHIR API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
# Runtime dependencies are pinned/managed in requirements.txt (already
# installed into agent/.venv). Kept minimal here so `pip install -e .` does
# not re-resolve the environment.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
